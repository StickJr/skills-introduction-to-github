<title>PC Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen workbench. Phone = stacked (3D view, status, info, parts tray); wide = 3D left, panel right.
   Deliberately single dark theme: a lit-up PC on a dark desk. */
:root {
  --bg: #0b0e12;
  --panel: #141920;
  --raise: #1c232b;
  --line: #29323c;
  --fg: #e6ebef;
  --muted: #8a96a2;
  --accent: #4fd1e8;
  --ok: #5ad48a;
  --warn: #f0a24b;
  --bad: #ff6b5e;
  --sel: #ffd84d;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
.app {
  height: 100%; box-sizing: border-box;
  display: grid; gap: 10px;
  grid-template-rows: auto minmax(0, 1fr) auto auto auto;
  grid-template-areas: "head" "scene" "status" "info" "tray";
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1200px; margin: 0 auto;
}
@media (min-width: 860px) {
  .app {
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "head head" "scene info" "scene status" "tray tray";
    padding-block: 18px; column-gap: 24px;
  }
  .info { align-self: start; }
}

/* Header */
header { grid-area: head; display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 8px; }
.grow { flex: 1; min-width: 0; }
h1 { margin: 0; font: 700 26px/1 var(--display); letter-spacing: .01em; }
.meta { font: 500 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.btn {
  font: 600 13px/1 var(--body); color: var(--fg);
  background: var(--raise); border: 1px solid var(--line); border-radius: 9px;
  padding: 8px 11px; cursor: pointer; white-space: nowrap;
  transition: border-color .2s, background .2s;
}
.btn:hover { border-color: var(--muted); }
.round {
  width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; padding: 0;
  background: var(--raise); border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  transition: color .3s, border-color .3s, box-shadow .4s;
}
.round.ready { color: var(--fg); border-color: var(--muted); }
.round.on { color: var(--ok); border-color: var(--ok); box-shadow: 0 0 16px color-mix(in srgb, var(--ok) 55%, transparent); }
.round.busy { color: var(--warn); border-color: var(--warn); }
.round.snd { color: var(--fg); }
button:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.bar { height: 4px; background: var(--raise); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s cubic-bezier(.2, .8, .2, 1); }

/* 3D scene */
.scene { grid-area: scene; min-height: 240px; position: relative; border-radius: 16px; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 35%, #18202a 0%, var(--bg) 70%); }
.scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.monitor { position: absolute; top: 10px; left: 10px; width: min(40%, 230px); pointer-events: none; }
.bezel { background: #050607; border: 3px solid #23282e; border-radius: 6px; position: relative; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.bezel canvas { position: static; display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; border-radius: 2px; }
.bezel::after { content: ""; position: absolute; right: 6px; bottom: -3px; width: 4px; height: 2px; border-radius: 1px; background: var(--mled, #6b4a1a); }
.cap { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 6px; margin-top: 5px; padding: 5px 6px; border-radius: 6px; background: rgba(11, 14, 18, .82); font: 500 9.5px/1 var(--mono); color: var(--muted); letter-spacing: .03em; }
.dbg { display: flex; gap: 6px; }
.dbg span { display: flex; align-items: center; gap: 3px; }
.dbg i { width: 6px; height: 6px; border-radius: 50%; background: #2f363e; transition: background .15s, box-shadow .15s; }
.dbg i.lit { background: var(--c); box-shadow: 0 0 6px var(--c); }
.hint { position: absolute; left: 12px; right: 12px; bottom: 8px; text-shadow: 0 1px 3px #000; text-align: center; font-size: 12px; color: var(--muted); pointer-events: none; transition: opacity .6s; }

/* Status */
.status { grid-area: status; margin: 0; text-align: center; color: var(--muted); font-size: 13px; min-height: 2.9em; text-wrap: balance; transition: color .3s; }
.status.live { color: var(--fg); }
@media (min-width: 860px) { .status { text-align: left; } }

/* Info panel */
.info { grid-area: info; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.info-top { display: flex; align-items: center; gap: 10px; }
.info-top .ico { width: 30px; height: 30px; flex: none; }
.info-top .txt { flex: 1; min-width: 0; }
.info h2 { margin: 0; font: 700 19px/1.15 var(--display); letter-spacing: .01em; }
.state { font: 500 12px/1.3 var(--mono); margin-top: 2px; }
.info .scroll { max-height: 118px; overflow-y: auto; display: grid; gap: 8px; }
.spec { font: 500 11.5px/1.4 var(--mono); color: var(--muted); }
.info p { margin: 0; font-size: 14px; max-width: 65ch; }
.tip { display: flex; gap: 8px; font-size: 13px; color: #e9cf7c; }
.tip b { font: 700 10px/1.9 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--sel); flex: none; }
@media (min-width: 860px) { .info .scroll { max-height: none; } }
.act { border: 0; border-radius: 10px; padding: 10px 14px; font: 600 14px/1 var(--body); cursor: pointer; flex: none; transition: filter .2s, opacity .2s; }
.act:hover { filter: brightness(1.1); }
.act.install { background: var(--accent); color: #062026; }
.act.remove { background: transparent; color: #ff8a80; border: 1px solid #6b3330; }
.act.dim { opacity: .45; }

/* Parts tray */
.tray { grid-area: tray; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tray::-webkit-scrollbar { display: none; }
.card {
  flex: none; width: 74px; display: grid; justify-items: center; gap: 4px;
  padding: 9px 4px 8px; border-radius: 12px; position: relative;
  background: var(--panel); border: 1px solid var(--line); color: var(--muted); cursor: pointer;
  font: 600 11.5px/1.1 var(--body);
  transition: border-color .25s, background .25s, color .25s, transform .15s;
}
.card:active { transform: scale(.96); }
@media (min-width: 860px) { .tray { justify-content: center; flex-wrap: wrap; } .card { width: 88px; } }
.card svg { width: 30px; height: 30px; }
.card.avail { color: var(--fg); }
.card.done { color: var(--tint); }
.card[aria-pressed="true"] { border-color: var(--sel); background: var(--raise); }
.card .badge { position: absolute; top: 5px; right: 6px; width: 14px; height: 14px; }
.err { padding: 24px; color: var(--muted); }
</style>

<div class="app">
  <header>
    <div class="row">
      <h1 class="grow">PC Builder</h1>
      <button class="round snd" id="sound" type="button" aria-label="Mute sound" title="Sound (on iPhone, turn off silent mode)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
      </button>
      <button class="round" id="power" type="button" aria-label="Power on">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
    <div class="row">
      <div class="meta grow" id="meta">0/9 parts · ≈0 W</div>
      <button class="btn" id="buildAll" type="button">Build all</button>
      <button class="btn" id="takeApart" type="button">Take apart</button>
    </div>
    <div class="bar"><i id="progress"></i></div>
  </header>

  <div class="scene" id="sceneBox">
    <canvas id="gl"></canvas>
    <div class="monitor">
      <div class="bezel" id="bezel"><canvas id="mon" width="480" height="270"></canvas></div>
      <div class="cap">
        <span>MONITOR</span>
        <span class="dbg" aria-label="Motherboard debug lights">
          <span><i data-dbg="CPU" style="--c:#ff5a4d"></i>CPU</span>
          <span><i data-dbg="DRAM" style="--c:#ffc533"></i>DRAM</span>
          <span><i data-dbg="VGA" style="--c:#f2f4f6"></i>VGA</span>
          <span><i data-dbg="BOOT" style="--c:#5ad48a"></i>BOOT</span>
        </span>
      </div>

    <div class="hint" id="hint">Drag to rotate · pinch to zoom · tap a dashed outline to install</div>

  <p class="status" id="status" aria-live="polite"></p>
  <section class="info" id="info" aria-live="polite"></section>
  <nav class="tray" id="tray" aria-label="Parts"></nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
// ================= Parts data =================
const PARTS = [
  { id: "case", name: "Case", short: "Case", tint: "#a7b2bd", req: [], w: 10, spec: "Mid-tower · 45 × 22 × 48 cm · 4 × 120 mm fans",
    sum: "The chassis that holds and protects everything. Its size (ATX, Micro-ATX, Mini-ITX) decides which motherboards fit. The front fans pull cool air in and the rear fan pushes hot air out.",
    tip: "Check the maximum GPU length and cooler height before buying a case." },
  { id: "psu", name: "Power Supply", short: "PSU", tint: "#f2cf3d", req: ["case"], w: 0, spec: "ATX · 850 W · 80 Plus Gold · fully modular",
    sum: "Turns AC power from the wall into the steady 12 V, 5 V and 3.3 V DC the parts need. Even when the PC is off, it supplies a small standby current so the power button works.",
    tip: "Leave 30–40% headroom above your peak power draw. Most gaming PCs use a 650–850 W unit." },
  { id: "mobo", name: "Motherboard", short: "Motherboard", tint: "#5ad48a", req: ["case"], w: 50, spec: "ATX · 30.5 × 24.4 cm · 4 RAM slots · PCIe 5.0",
    sum: "The main circuit board. Every part connects through it: the CPU socket, RAM slots, PCIe slot for the graphics card and M.2 slots for SSDs. Its BIOS runs the startup self-test (POST).",
    tip: "The CPU socket (for example AM5 or LGA 1851) must match your processor. The four debug lights show where startup gets stuck." },
  { id: "cpu", name: "Processor (CPU)", short: "CPU", tint: "#5b8cff", req: ["mobo"], w: 125, spec: "8 cores / 16 threads · up to 4.7 GHz · ≈4 × 4 cm",
    sum: "The processor is the brain. In games it runs the game logic, physics and AI, and tells the graphics card what to draw.",
    tip: "Line up the small gold triangle on the CPU with the mark on the socket. Never force it in." },
  { id: "cooler", name: "CPU Cooler", short: "Cooler", tint: "#4fd1e8", req: ["cpu"], w: 5, spec: "Tower air cooler · 4 heat pipes · 120 mm fan",
    sum: "A CPU makes over 100 W of heat in a space the size of a stamp. Heat pipes carry it into thin aluminium fins, and the fan blows it away.",
    tip: "Put a pea-sized dot of thermal paste on the CPU first. Without a cooler, a CPU overheats within seconds." },
  { id: "ram", name: "Memory (RAM)", short: "RAM", tint: "#b06cff", req: ["mobo"], w: 10, spec: "2 × 16 GB DDR5-6000 · slots A2 + B2",
    sum: "Fast short-term memory that holds what the CPU is working on right now. It's wiped when the PC turns off. 32 GB is a common gaming sweet spot.",
    tip: "With two sticks, use slots A2 and B2 (the 2nd and 4th from the CPU), then turn on XMP or EXPO in the BIOS." },
  { id: "ssd", name: "Storage (SSD)", short: "SSD", tint: "#f0a24b", req: ["mobo"], w: 8, spec: "M.2 2280 NVMe · 2 TB · 22 × 80 mm",
    sum: "Long-term storage for the operating system, your games and files. An NVMe SSD plugs straight into the motherboard and is many times faster than a hard drive.",
    tip: "Without a drive holding an operating system, the PC starts but stops at 'No bootable device'." },
  { id: "gpu", name: "Graphics Card (GPU)", short: "GPU", tint: "#ff6b5e", req: ["mobo"], w: 300, spec: "16 GB · ≈30 cm long · 2.5 slots · 3 fans",
    sum: "The graphics card draws every frame you see. It's the most important part for gaming performance, and usually the most expensive and power-hungry.",
    tip: "Use the top PCIe x16 slot. Push until the latch clicks, then screw the bracket to the case." },
  { id: "cables", name: "Cables", short: "Cables", tint: "#ff7eb6", req: ["psu", "mobo", "gpu"], w: 0, spec: "24-pin ATX · 8-pin CPU (EPS) · 12V-2×6 GPU · front panel",
    sum: "The 24-pin cable powers the motherboard, the 8-pin cable feeds the CPU, and the GPU gets its own cable. Thin front-panel wires connect the case's power button to the motherboard.",
    tip: "When a new build won't turn on, it's usually a loose cable or front-panel connector." },
];
const BY = Object.fromEntries(PARTS.map((p, i) => [p.id, Object.assign(p, { idx: i })]));

const ICONS = {
  case: '<rect x="6" y="2.5" width="12" height="19" rx="2"/><circle cx="12" cy="15" r="3"/><path d="M9 6h6"/>',
  psu: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M12.5 8.5 10 12h4l-2.5 3.5"/>',
  mobo: '<rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="5" height="5"/><path d="M15 6v8M17.5 6v8M6 17h10"/>',
  cpu: '<rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/>',
  cooler: '<circle cx="12" cy="12" r="9"/><path d="M12 12c0-4 2-5.5 4-5M12 12c3.5 2 3.8 4.4 2.5 6M12 12c-3.5 2-5.8 1-6.5-1"/>',
  ram: '<rect x="2.5" y="7" width="19" height="8" rx="1"/><path d="M6 10h2M10 10h2M14 10h2M5 15v3M19 15v3M11 15v3"/>',
  ssd: '<rect x="2.5" y="9" width="19" height="6" rx="1"/><path d="M5.5 9v6M9 12h7"/>',
  gpu: '<rect x="2.5" y="6" width="19" height="10" rx="2"/><circle cx="8" cy="11" r="2.6"/><circle cx="16" cy="11" r="2.6"/><path d="M5 16v2.5h8V16"/>',
  cables: '<path d="M4 20c0-6 4-6 8-8s8-2 8-8"/><path d="M3 18h3v4H3zM18 2h3v4h-3z"/>',
};
const icon = (id, extra = "") =>
  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${ICONS[id]}</svg>`;

// ================= Sound (synthesised with Web Audio) =================
const Snd = {
  ctx: null, on: true,
  init() {
    if (this.ctx) { if (this.ctx.state !== "running") this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.out = c.createGain(); this.out.gain.value = this.on ? 0.9 : 0;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3;
    this.out.connect(comp); comp.connect(c.destination);
    // Soft echo bus for chimes
    this.wet = c.createGain(); this.wet.gain.value = 0.35;
    const dl = c.createDelay(1); dl.delayTime.value = 0.17;
    const fb = c.createGain(); fb.gain.value = 0.3;
    const lp = c.createBiquadFilter(); lp.frequency.value = 2400;
    this.wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(this.out);
    // Noise buffers
    const len = c.sampleRate * 2;
    this.white = c.createBuffer(1, len, c.sampleRate);
    const w = this.white.getChannelData(0); for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;
    const brown = c.createBuffer(1, len, c.sampleRate);
    const b = brown.getChannelData(0); let last = 0;
    for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }
    // Airflow (fans): looping brown noise through a low-pass filter
    const fs = c.createBufferSource(); fs.buffer = brown; fs.loop = true;
    this.fanF = c.createBiquadFilter(); this.fanF.type = "lowpass"; this.fanF.frequency.value = 250;
    this.fanG = c.createGain(); this.fanG.gain.value = 0;
    fs.connect(this.fanF); this.fanF.connect(this.fanG); this.fanG.connect(this.out); fs.start();
    // Faint electrical hum
    this.humG = c.createGain(); this.humG.gain.value = 0; this.humG.connect(this.out);
    [100, 200].forEach((f, i) => { const o = c.createOscillator(); o.frequency.value = f; const g = c.createGain(); g.gain.value = i ? 0.3 : 1; o.connect(g); g.connect(this.humG); o.start(); });
  },
  setOn(v) { this.on = v; if (this.out) this.out.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.05); },
  tone({ f, type = "sine", at = 0, dur = 0.3, gain = 0.12, attack = 0.005, to = null, wet = 0, lp = null }) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let n = o; if (lp) { const fl = c.createBiquadFilter(); fl.frequency.value = lp; o.connect(fl); n = fl; }
    n.connect(g); g.connect(this.out);
    if (wet) { const wg = c.createGain(); wg.gain.value = wet; g.connect(wg); wg.connect(this.wet); }
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise({ at = 0, dur = 0.05, gain = 0.2, type = "bandpass", f = 2000, q = 1, to = null, attack = 0.002 }) {
    if (!this.ctx) return;
    const c = this.ctx, t = c.currentTime + at;
    const s = c.createBufferSource(); s.buffer = this.white;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q;
    if (to) fl.frequency.exponentialRampToValueAtTime(to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.out);
    s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  fan(level) { if (!this.ctx) return; const t = this.ctx.currentTime; this.fanG.gain.setTargetAtTime(Math.min(0.32, level * 0.3), t, 0.3); this.fanF.frequency.setTargetAtTime(200 + level * 1200, t, 0.3); },
  hum(on) { if (!this.ctx) return; this.humG.gain.setTargetAtTime(on ? 0.008 : 0, this.ctx.currentTime, on ? 0.2 : 0.5); },
};
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
const sfx = {
  tick: () => Snd.tone({ f: 1500, type: "triangle", dur: 0.05, gain: 0.04 }),
  install(i) {
    Snd.noise({ dur: 0.035, gain: 0.22, f: 3200, q: 2 });                  // snap
    Snd.tone({ f: 150, to: 70, dur: 0.14, gain: 0.22 });                    // seat thump
    Snd.tone({ f: NOTES[i], type: "triangle", at: 0.05, dur: 0.6, gain: 0.08, attack: 0.01, wet: 0.5 });
    Snd.tone({ f: NOTES[i] * 1.5, at: 0.12, dur: 0.5, gain: 0.035, attack: 0.01, wet: 0.5 });
  },
  remove(i) {
    Snd.noise({ dur: 0.3, gain: 0.08, f: 700, to: 2600, q: 0.8, attack: 0.08 }); // whoosh
    Snd.tone({ f: NOTES[i], to: NOTES[i] * 0.7, dur: 0.4, gain: 0.06, attack: 0.02, wet: 0.3 });
  },
  deny() { Snd.tone({ f: 233, type: "triangle", dur: 0.12, gain: 0.07 }); Snd.tone({ f: 196, type: "triangle", at: 0.1, dur: 0.18, gain: 0.07 }); },
  button() { Snd.noise({ dur: 0.012, gain: 0.35, type: "highpass", f: 2500 }); Snd.noise({ at: 0.09, dur: 0.01, gain: 0.2, type: "highpass", f: 3000 }); },
  relay() { Snd.noise({ dur: 0.02, gain: 0.35, type: "lowpass", f: 1800 }); Snd.tone({ f: 95, dur: 0.06, gain: 0.08 }); },
  postBeep() { Snd.tone({ f: 1000, type: "square", dur: 0.18, gain: 0.05, attack: 0.003, lp: 2600 }); },
  longBeeps(n) { for (let i = 0; i < n; i++) Snd.tone({ f: 750, type: "square", at: i * 1.0, dur: 0.7, gain: 0.045, attack: 0.01, lp: 2200 }); },
  alarm() { for (let i = 0; i < 8; i++) Snd.tone({ f: i % 2 ? 660 : 880, type: "square", at: i * 0.28, dur: 0.24, gain: 0.04, lp: 2400 }); },
  monOn() { Snd.tone({ f: 2400, dur: 0.04, gain: 0.02 }); },

function std(color, rough = 0.6, metal = 0.1, extra = {}) {
  return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: rough, metalness: metal }, extra));
}
function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); if (parent) parent.add(m); return m;
}
function tex(w, h, paint) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  paint(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function rgbMat(color, peak = 1.6, map = null) {
  const m = std(0x1a1d22, 0.4, 0.1, { emissive: color, emissiveIntensity: 0 });
  if (map) { m.emissive.set(0xffffff); m.emissiveMap = map; }
  m.userData.peak = peak; rgbMats.push(m); return m;
}
function gradTex(vertical) {
  return tex(vertical ? 8 : 256, vertical ? 256 : 8, (g, w, h) => {
    const gr = vertical ? g.createLinearGradient(0, 0, 0, h) : g.createLinearGradient(0, 0, w, 0);
    ["#ff5fa2", "#b06cff", "#5b8cff", "#4fd1e8", "#5ad48a"].forEach((c, i, a) => gr.addColorStop(i / (a.length - 1), c));
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  });
}

// A fan. Its axis points along local +z.
function makeFan(s, role, part, ring) {
  const g = new THREE.Group(), d = s * 0.21, bar = s * 0.07;
  const fm = std(0x15181c, 0.7, 0.2);
  box(s, bar, d, fm, 0, s / 2 - bar / 2, 0, g); box(s, bar, d, fm, 0, -s / 2 + bar / 2, 0, g);
  box(bar, s, d, fm, s / 2 - bar / 2, 0, 0, g); box(bar, s, d, fm, -s / 2 + bar / 2, 0, 0, g);
  const shroud = new THREE.Mesh(new THREE.CylinderGeometry(s * 0.47, s * 0.47, d, 40, 1, true), std(0x15181c, 0.7, 0.2, { side: THREE.DoubleSide }));
  shroud.rotation.x = Math.PI / 2; g.add(shroud);
  if (ring) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(s * 0.45, s * 0.02, 8, 48), rgbMat(ring, 2.2));
    t.position.z = d * 0.5; g.add(t);
  }
  const rotor = new THREE.Group(); g.add(rotor);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(s * 0.15, s * 0.15, d * 0.8, 24), std(0x262b31, 0.45, 0.4));
  hub.rotation.x = Math.PI / 2; rotor.add(hub);
  const bm = std(ring ? 0x9aa3ac : 0x5b636c, 0.45, 0.1);
  const bg = new THREE.BoxGeometry(s * 0.17, s * 0.3, 0.1);
  for (let i = 0; i < 7; i++) {
    const piv = new THREE.Group(); piv.rotation.z = (i * 2 * Math.PI) / 7;
    const b = new THREE.Mesh(bg, bm); b.position.y = s * 0.28; b.rotation.y = 0.55; b.rotation.z = 0.3;
    piv.add(b); rotor.add(piv);
  }
  fans.push({ rotor, role, part, speed: 0 });
  return g;
}

let userMoved = false, downAt = null;
const VIEW_DIR = new THREE.Vector3(0.62, 0.34, 1).normalize();
function resize() {
  const w = sceneBox.clientWidth, h = sceneBox.clientHeight;

  renderer.setSize(w, h, false);

  if (!userMoved) {
    const t = Math.tan((camera.fov * Math.PI) / 360);
    const d = Math.max(30 / t, 30 / (t * camera.aspect)) * 1.08;

function pick(e) {
  const r = canvas.getBoundingClientRect();
  const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(v, camera);
  const objs = PARTS.filter(p => has(p.id)).map(p => G[p.id]).concat(Object.values(GHOST).filter(g => g.visible));
  const hit = raycaster.intersectObjects(objs, true).find(h => !h.object.userData.noPick);
  if (!hit) return;
  let o = hit.object;
  while (o && !o.userData.partId && !o.userData.ghostId) o = o.parent;
  if (!o) return;
  if (o.userData.ghostId) install(o.userData.ghostId);
  else if (S.selected !== o.userData.partId) { S.selected = o.userData.partId; sfx.tick(); render(); }

// ================= Animation =================
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const tweens = new Set();
function tween(dur, fn, done, ease = easeOut) {
  const tw = { t: 0, dur: reduced ? dur * 0.35 : dur, fn, done, ease, dead: false };
  tweens.add(tw); fn(ease(0)); return tw;
}

function setFade(g, a) {
  g.userData.fade = a;
  g.userData.mats.forEach(m => {
    const b = m.userData.base, tr = b.t || a < 0.999;
    if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
    m.opacity = b.o * a;
    m.depthWrite = a < 0.999 ? a > 0.5 && b.dw : b.dw;
  });
}
function setDrawn(g, k) {
  if (!g.userData.tubes) return;
  g.userData.tubes.forEach(t => { const n = t.geometry.index.count; t.geometry.setDrawRange(0, Math.max(0, Math.floor((n * k) / 6) * 6)); });
}
// Where a part starts from when sliding in (it enters through the open side panel)
function entryOffset(id) {
  return id === "case" ? new THREE.Vector3(0, 3, 0) : id === "cables" ? new THREE.Vector3() : new THREE.Vector3(0, 0, 9);
}

function animateIn(id) {
  const g = G[id];
  if (g.userData.tw) g.userData.tw.dead = true;
  const from = g.parent ? g.position.clone() : entryOffset(id), f0 = g.parent ? g.userData.fade : 0;
  if (!g.parent) { scene.add(g); setFade(g, 0); }
  g.userData.leaving = false;
  g.userData.tw = tween(0.75, k => {
    g.position.copy(from).multiplyScalar(1 - k);
    setFade(g, f0 + (1 - f0) * Math.min(1, k * 1.4));
    setDrawn(g, id === "cables" ? k : 1);
  }, null, easeOut);
}
function animateOut(id) {
  const g = G[id];
  if (g.userData.tw) g.userData.tw.dead = true;
  const from = g.position.clone(), to = entryOffset(id), f0 = g.userData.fade;
  g.userData.leaving = true;
  g.userData.tw = tween(0.55, k => {
    g.position.lerpVectors(from, to, k);
    setFade(g, f0 * (1 - k));
    setDrawn(g, id === "cables" ? 1 - k : 1);
  }, () => { scene.remove(g); g.position.set(0, 0, 0); setDrawn(g, 1); }, easeIn);
}

let lastT = performance.now(), frameN = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now; frameN++;
  tweens.forEach(tw => {
    if (tw.dead) { tweens.delete(tw); return; }
    tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    tw.fn(tw.ease(k));
    if (k >= 1) { tweens.delete(tw); tw.done && tw.done(); }
  });

  // Fans: spin up quickly, coast down slowly (inertia)
  let lvl = 0, n = 0;
  fans.forEach(f => {
    const target = has(f.part) ? fanT[f.role] : 0;
    const tau = target > f.speed ? 0.6 : 2.4;
    f.speed += (target - f.speed) * (1 - Math.exp(-dt / tau));
    f.rotor.rotation.z -= f.speed * 22 * dt;
    if (has(f.part)) { lvl += f.speed; n++; }
  });
  if (frameN % 6 === 0) Snd.fan(n ? (lvl / n) * Math.min(1, n / 5) : 0);

  // Lights
  FX.rgb += (FX.rgbTarget - FX.rgb) * (1 - Math.exp(-dt / (FX.rgbTarget > FX.rgb ? 0.45 : 0.15)));
  const pulse = 0.85 + 0.15 * Math.sin(now / 900);
  rgbMats.forEach(m => { m.emissiveIntensity = FX.rgb * m.userData.peak * pulse; });
  REF.glowA.intensity = FX.rgb * 1.3; REF.glowB.intensity = FX.rgb * 1.0;
  FX.led += (FX.ledTarget - FX.led) * (1 - Math.exp(-dt / 0.08));
  REF.powerLed.emissiveIntensity = FX.led * 2.4;
  REF.ssdLed.emissiveIntensity = FX.ssdBusy ? (Math.random() < 0.45 ? 2.5 : 0.1) : 0;
  REF.standby.emissiveIntensity = has("psu") && has("cables") ? 1.6 : 0;
  Object.entries(REF.debug).forEach(([k, m]) => { m.emissiveIntensity = FX.debug === k ? 2.6 : 0; });

  // Ghost outlines breathe gently
  PARTS.forEach(p => {
    const gh = GHOST[p.id];
    const want = canInstall(p.id) && S.power === "off" ? 1 : 0;
    gh.userData.vis += (want - gh.userData.vis) * (1 - Math.exp(-dt / 0.2));
    gh.visible = gh.userData.vis > 0.02;
    const hl = S.selected === p.id, br = 0.6 + 0.4 * Math.sin(now / 420);
    gh.userData.fill.color.set(hl ? 0xffd84d : 0xffffff);
    gh.userData.line.color.set(hl ? 0xffd84d : 0xffffff);
    gh.userData.fill.opacity = (hl ? 0.16 : 0.07) * br * gh.userData.vis;
    gh.userData.line.opacity = (hl ? 0.95 : 0.5) * (0.7 + 0.3 * br) * gh.userData.vis;
  });

  // Selection box
  const sp = S.selected;
  const showSel = sp && has(sp) && sp !== "cables" && sp !== "case" && !G[sp].userData.leaving;
  if (showSel) { selHelper.box.copy(BBOX[sp]).expandByScalar(0.25).translate(G[sp].position); }
  selHelper.visible = showSel;
  selHelper.material.opacity = 0.5 + 0.35 * Math.sin(now / 300);

  controls.update();
  renderer.render(scene, camera);
  drawMon(now);
  requestAnimationFrame(frame);
}

// ================= Power sequence =================
const CANCEL = {};
function say(msg) { S.status = msg; renderStatus(); }
function setDebug(n) {
  FX.debug = n;
  document.querySelectorAll("[data-dbg]").forEach(i => i.classList.toggle("lit", i.dataset.dbg === n));
}
function stepper(tok) {
  return ms => new Promise((res, rej) => setTimeout(() => (tok === S.run ? res() : rej(CANCEL)), reduced ? ms * 0.6 : ms));
}

async function powerOn() {
  const tok = ++S.run, step = stepper(tok);
  sfx.button();
  if (!has("cables")) {
    say(has("psu") && has("mobo")
      ? "Nothing happens. The power button only works once the cables connect the PSU, motherboard and front panel."
      : "Nothing happens. A PC needs at least a power supply, a motherboard and cables to switch on.");
    return;
  }
  try {
    S.power = "starting"; render();
    say("Power button pressed. The motherboard signals the power supply to start (PS_ON).");
    await step(450);
    sfx.relay(); Snd.hum(true);
    say("The PSU switches on and checks its 12 V, 5 V and 3.3 V outputs, then sends 'Power Good' to the motherboard.");
    await step(900);
    FX.ledTarget = 1; fanT.case = 1; fanT.cpu = 1; fanT.gpu = 1;
    say("Power is good. The case LED lights and every fan spins up to full speed for a moment.");
    await step(1200);
    setDebug("CPU");
    say("POST (power-on self-test) begins. The BIOS checks the processor first.");
    await step(1300);
    if (!has("cpu")) { fault(); say("Stuck on the CPU debug light: no processor found. The fans keep spinning, but nothing reaches the screen."); setMon("nosignal"); return; }
    setDebug("DRAM");
    say("Memory training: the BIOS tests the RAM and tunes its timings. On a first boot with DDR5 this can take a while.");
    await step(1800);
    if (!has("ram")) { fault(); setMon("nosignal"); sfx.longBeeps(3); say("Stuck on the DRAM debug light, with long warning beeps: no memory found. The PC can't run without RAM."); return; }
    FX.rgbTarget = 1;
    setDebug("VGA");
    say("Memory OK, so the RGB lights come on. Now the BIOS starts the graphics card and sends a picture to the monitor.");
    await step(1100);
    setMon("splash"); sfx.monOn();
    await step(500);
    setDebug(null); sfx.postBeep();
    fanT.case = 0.45; fanT.cpu = 0.5;
    say("One short beep: POST passed. The BIOS takes over fan control, so the fans slow down to quieter speeds.");
    await step(2000);
    if (!has("cooler")) {
      fault(); setMon("temp"); sfx.alarm();
      say("No CPU cooler: with nothing to carry the heat away, the CPU temperature shoots up within seconds.");
      await step(3000);
      setMon("overheat");
      say("At about 100 °C the CPU protects itself and the PC switches off. Install a cooler with thermal paste.");
      await step(2000);
      cutPower("The PC shut itself down to avoid damage. Turn it off, install the cooler and try again.");
      return;
    }
    setDebug("BOOT");
    say("Hardware ready. The BIOS looks for a drive with an operating system on it.");
    await step(1100);
    if (!has("ssd")) { fault(); setMon("noboot"); say("'No bootable device': the hardware works, but there's no SSD with an operating system. Shut down and install the SSD."); return; }
    setDebug(null); FX.ssdBusy = true; setMon("loading");
    say("Booting from the NVMe SSD. Its activity light flickers as the operating system loads into RAM.");
    await step(3000);
    FX.ssdBusy = false; fanT.gpu = 0; setMon("desktop"); sfx.chime();
    S.power = "on"; render();
    say(`Ready to play! At the desktop the GPU fans stop (zero-RPM mode) until a game heats the card up. Under load this PC draws about ${draw()} W.`);
  } catch (e) { if (e !== CANCEL) throw e; }
}

function fault() { S.power = "fault"; render(); }

async function powerOff() {
  const tok = ++S.run, step = stepper(tok);
  sfx.button();
  try {
    if (S.power === "on") {
      S.power = "stopping"; render();
      setMon("shutdown"); FX.ssdBusy = true; sfx.bye();
      say("Shutting down: the operating system closes programs and saves everything to the SSD.");
      await step(2200);
      FX.ssdBusy = false;
      cutPower("Powered off. The PSU cuts power and the fans coast to a stop. The standby light shows the PSU still has wall power.");
    } else {
      cutPower("Forced off (like holding the power button for 4 seconds). The fans coast to a stop.");
    }
  } catch (e) { if (e !== CANCEL) throw e; }
}

function cutPower(msg) {
  sfx.relay(); Snd.hum(false);
  fanT.case = fanT.cpu = fanT.gpu = 0;
  FX.rgbTarget = 0; FX.ledTarget = 0; FX.ssdBusy = false;
  setDebug(null); setMon("off");
  S.power = "off"; render();
  say(msg);
}

// ================= Build actions =================
let autoTimer = null;
function guardPower() {
  if (S.power === "off") return false;
  sfx.deny();
  say("Shut down the PC first. Never add or remove parts while it has power. Unplug it, too.");
  return true;
}
function install(id, quiet) {
  if (S.installed.has(id) || guardPower()) return;
  const m = missing(id);
  if (m.length) { sfx.deny(); say(`The ${BY[id].short} needs the ${names(m)} installed first.`); render(); return; }
  S.installed.add(id); S.selected = id;
  animateIn(id);
  if (!quiet) sfx.install(BY[id].idx);
  const next = PARTS.find(p => canInstall(p.id));
  say(next ? `${BY[id].name} installed. Next up: ${next.short}.` : "Build complete! Press the power button to start it.");
  render();
}
function remove(id) {
  if (!S.installed.has(id) || guardPower()) return;
  const b = blockers(id);
  if (b.length) { sfx.deny(); say(`Remove the ${names(b)} first. It's attached to the ${BY[id].short}.`); render(); return; }
  S.installed.delete(id);
  animateOut(id); sfx.remove(BY[id].idx);
  say(`${BY[id].name} removed.`);
  render();
}
function runSequence(ids, fn, after) {
  clearInterval(autoTimer);
  let i = 0;
  const tick = () => { if (i >= ids.length) { clearInterval(autoTimer); after && after(); return; } fn(ids[i++]); };
  tick(); autoTimer = setInterval(tick, 520);
}
function buildAll() {
  if (guardPower()) return;
  runSequence(PARTS.map(p => p.id).filter(id => !has(id)), id => install(id));
}
function takeApart() {
  if (guardPower()) return;
  const ids = PARTS.map(p => p.id).filter(has).reverse();
  if (!ids.length) { say("Nothing to take apart yet."); return; }
  runSequence(ids, remove, () => { S.selected = "case"; say("Everything is taken apart. Start again with the case."); render(); });
}

// ================= UI =================
function stateLine(id) {
  if (has(id)) {
    const b = blockers(id);
    return b.length ? [`Installed · remove ${b.map(i => BY[i].short).join(", ")} first`, "var(--ok)"] : [`Installed · ≈${BY[id].w} W`, "var(--ok)"];
  }
  const m = missing(id);
  return m.length ? [`Needs: ${m.map(i => BY[i].short).join(", ")}`, "var(--warn)"] : ["Ready to install", "var(--accent)"];
}
function renderInfo() {
  const p = BY[S.selected];
  const [txt, col] = stateLine(p.id);
  const inst = has(p.id), dim = S.power !== "off" ? " dim" : "";
  document.getElementById("info").innerHTML = `
    <div class="info-top">
      <span class="ico" style="color:${p.tint}">${icon(p.id, 'width="30" height="30"')}</span>
      <div class="txt"><h2>${p.name}</h2><div class="state" style="color:${col}">${txt}</div></div>
      ${inst ? `<button class="act remove${dim}" id="act" type="button">Remove</button>`
             : `<button class="act install${canInstall(p.id) ? "" : " dim"}${dim}" id="act" type="button">Install</button>`}
    </div>
    <div class="scroll">
      <div class="spec">${p.spec}</div>
      <p>${p.sum}</p>
      <div class="tip"><b>Tip</b><span>${p.tip}</span></div>
    </div>`;
  document.getElementById("act").onclick = () => { Snd.init(); inst ? remove(p.id) : install(p.id); };
}
function renderTray() {
  document.getElementById("tray").innerHTML = PARTS.map(p => {
    const done = has(p.id), avail = canInstall(p.id);
    const badge = done
      ? `<svg class="badge" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="var(--ok)"/><path d="M4.5 8.2l2.3 2.3 4.7-4.8" fill="none" stroke="#0b0e12" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : avail ? "" : `<svg class="badge" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="7" rx="1.5" fill="var(--warn)"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 5 0V7" fill="none" stroke="var(--warn)" stroke-width="1.6"/></svg>`;
    return `<button class="card${done ? " done" : avail ? " avail" : ""}" type="button" data-id="${p.id}" style="--tint:${p.tint}" aria-pressed="${S.selected === p.id}">${icon(p.id)}<span>${p.short}</span>${badge}</button>`;
  }).join("");
}
document.getElementById("tray").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  Snd.init();
  if (S.selected !== c.dataset.id) { S.selected = c.dataset.id; sfx.tick(); render(); }
});
function renderStatus() {
  const el = document.getElementById("status");
  el.textContent = S.status;
  el.classList.toggle("live", S.power !== "off");
}
function render() {
  document.getElementById("meta").textContent = `${S.installed.size}/${PARTS.length} parts · ≈${draw()} W`;
  document.getElementById("progress").style.width = `${(S.installed.size / PARTS.length) * 100}%`;
  const pw = document.getElementById("power");
  pw.classList.toggle("ready", has("cables"));
  pw.classList.toggle("on", S.power === "on");
  pw.classList.toggle("busy", ["starting", "stopping", "fault"].includes(S.power));
  pw.setAttribute("aria-label", S.power === "off" ? "Power on" : "Power off");
  renderStatus(); renderInfo(); renderTray();
}

document.getElementById("power").onclick = () => {
  Snd.init();
  if (S.power === "off") powerOn();
  else if (S.power !== "stopping") powerOff();
};
document.getElementById("buildAll").onclick = () => { Snd.init(); buildAll(); };
document.getElementById("takeApart").onclick = () => { Snd.init(); takeApart(); };
document.getElementById("sound").onclick = e => {
  Snd.init(); Snd.setOn(!Snd.on);
  document.getElementById("wave").toggleAttribute("hidden", !Snd.on);
  document.getElementById("mute").toggleAttribute("hidden", Snd.on);
  e.currentTarget.setAttribute("aria-label", Snd.on ? "Mute sound" : "Turn sound on");
};
document.addEventListener("pointerdown", () => Snd.init(), { once: true });

// ================= Start =================
function start() {
  if (!THREE_OK || !THREE.OrbitControls) {
    document.getElementById("sceneBox").innerHTML = '<p class="err">The 3D view could not load. Check your connection and reload the page.</p>';
    return;
  }
  initScene();
  // Open with a half-built example PC so the first view shows how it works.
  ["case", "psu", "mobo", "cpu"].forEach(id => { S.installed.add(id); scene.add(G[id]); setFade(G[id], 1); });
  S.selected = "cooler";
  S.status = "Example: a half-built PC. The CPU is in, so the cooler is next. Tap Install, or tap its dashed outline.";
  setMon("off");
  render();
  requestAnimationFrame(frame);
}
Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(start);
</script>
