<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Neon Fairway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cyan:#36f2ff; --pink:#ff3cf0; --gold:#ffd34d; --green:#5dffa0; --orange:#ff9b3d; --red:#ff3d6e;
  --bg:#070418; --panel:rgba(14,10,44,.58); --line:rgba(130,210,255,.28); --text:#eaf6ff; --dim:#9fb3d9;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Rajdhani,system-ui,sans-serif;touch-action:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app,#app canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#touch{position:fixed;inset:0;z-index:5}
#swipe{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hidden{opacity:0;pointer-events:none!important;visibility:hidden}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 24px rgba(54,242,255,.08),inset 0 0 18px rgba(54,242,255,.06)}
.icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:20px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s}
.icon:active{transform:scale(.9)}
.orb{font-family:Orbitron,sans-serif;letter-spacing:.08em}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .5s,visibility .5s}
#hud button{pointer-events:auto}
.top{position:absolute;left:12px;right:12px;top:calc(10px + var(--st));display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.holeinfo{display:flex;gap:10px;align-items:center;padding:8px 14px 8px 8px}
.holeinfo .btns{display:flex;flex-direction:column;gap:6px}
.holeinfo .icon{width:36px;height:36px;font-size:16px;border-radius:11px}
.hnum{font-family:Orbitron;font-size:11px;color:var(--cyan);letter-spacing:.2em}
.hname{font-family:Orbitron;font-weight:700;font-size:15px;letter-spacing:.04em;margin:2px 0}
.hmeta{font-size:14px;color:var(--dim);font-weight:600;letter-spacing:.05em}
.hmeta b{color:var(--text)}
.wind{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px}
.dial{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);position:relative;background:radial-gradient(circle,rgba(54,242,255,.12),transparent 70%)}
.dial:before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px dashed rgba(130,210,255,.2)}
.arrow{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.arrow:before{content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);border:8px solid transparent;border-bottom:16px solid var(--cyan);border-top:0;filter:drop-shadow(0 0 6px var(--cyan))}
.arrow:after{content:"";position:absolute;left:50%;top:21px;bottom:12px;width:3px;transform:translateX(-50%);background:linear-gradient(var(--cyan),transparent);border-radius:2px}
.wtxt{display:flex;flex-direction:column;align-items:center;line-height:1}
.wtxt b{font-family:Orbitron;font-size:22px}
.wtxt small{font-size:11px;color:var(--dim);letter-spacing:.2em;margin-top:3px}
.wtxt i{font-style:normal;font-size:11px;color:var(--cyan);margin-top:3px;letter-spacing:.1em}
.ctop{position:absolute;left:0;right:0;top:calc(96px + var(--st));display:flex;justify-content:center}
.pill{padding:7px 16px;border-radius:99px;font-size:16px;font-weight:600;display:flex;gap:10px;align-items:center}
.pill b{font-family:Orbitron;font-size:20px}
.lie{font-family:Orbitron;font-size:10px;letter-spacing:.2em;padding:3px 8px;border-radius:99px;border:1px solid currentColor;color:var(--cyan)}
.bottom{position:absolute;left:12px;right:12px;bottom:calc(14px + var(--sb));display:flex;align-items:center;justify-content:center;gap:12px}
.bottom .icon.big{width:54px;height:54px;font-size:30px;border-radius:18px}
.club{min-width:136px;height:62px;padding:6px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;transition:transform .15s}
.club:active{transform:scale(.94)}
.club small{font-size:10px;letter-spacing:.25em;color:var(--dim)}
.club b{font-family:Orbitron;font-size:17px;color:var(--cyan);text-shadow:0 0 12px rgba(54,242,255,.6)}
#btnView{position:absolute;right:0}
.hint{position:absolute;left:0;right:0;bottom:calc(98px + var(--sb));text-align:center;font-family:Orbitron;font-size:12px;letter-spacing:.25em;color:rgba(234,246,255,.85);text-shadow:0 0 12px rgba(54,242,255,.8);transition:opacity .4s}
.hint small{font-family:Rajdhani;letter-spacing:.15em;color:var(--dim);font-size:12px}
.chev{display:block;margin:0 auto 6px;width:20px;height:28px;position:relative}
.chev i{position:absolute;left:3px;width:14px;height:14px;border-left:3px solid var(--cyan);border-top:3px solid var(--cyan);transform:rotate(45deg);animation:chev 1.4s infinite;opacity:0}
.chev i:nth-child(2){animation-delay:.2s}.chev i:nth-child(3){animation-delay:.4s}
@keyframes chev{0%{top:22px;opacity:0}40%{opacity:1}100%{top:0;opacity:0}}

#meter{position:absolute;right:18px;top:50%;width:14px;height:42vh;transform:translateY(-50%) scaleX(.6);border-radius:10px;border:1px solid var(--line);background:rgba(10,8,30,.6);overflow:visible;opacity:0;transition:opacity .25s,transform .25s}
#meter.on{opacity:1;transform:translateY(-50%) scaleX(1)}
#meter .fill{position:absolute;left:2px;right:2px;bottom:2px;border-radius:8px;height:0;background:linear-gradient(to top,var(--cyan),#a4fffb 70%,var(--gold) 92%,var(--red));box-shadow:0 0 16px var(--cyan)}
#meter .mark{position:absolute;left:-6px;right:-6px;bottom:calc(100%/1.08);height:2px;background:#fff;box-shadow:0 0 8px #fff}
#meter .pct{position:absolute;right:22px;bottom:0;font-family:Orbitron;font-size:15px;white-space:nowrap;text-shadow:0 0 10px var(--cyan)}

#stats{position:absolute;left:10px;top:calc(146px + var(--st));width:196px;padding:10px 12px;transform:translateX(-130%);transition:transform .55s cubic-bezier(.2,1.35,.4,1),opacity .4s;opacity:0}
#stats.on{transform:none;opacity:1}
.rating{font-family:Orbitron;font-weight:900;font-size:24px;letter-spacing:.06em;margin-bottom:6px;display:inline-block;animation:pop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:none;opacity:1}}
.srow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin:5px 0;letter-spacing:.06em}
.srow span{width:66px;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.14em}
.bar{flex:1;height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width .7s cubic-bezier(.2,1,.3,1)}
.srow em{font-style:normal;width:34px;text-align:right;font-family:Orbitron;font-size:11px}
.shape{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.shape canvas{width:44px;height:58px}
.shape b{font-family:Orbitron;font-size:13px;letter-spacing:.06em;display:block}
.shape small{color:var(--dim);font-size:12px}
.dist{margin-top:6px;font-size:13px;color:var(--dim);letter-spacing:.06em;min-height:16px}
.dist b{color:var(--text);font-family:Orbitron;font-size:12px}

#toast{position:fixed;left:0;right:0;top:38%;z-index:15;text-align:center;pointer-events:none;transition:opacity .35s,transform .45s cubic-bezier(.2,1.5,.4,1);opacity:0;transform:scale(.6)}
#toast.on{opacity:1;transform:none}
#toast .t{font-family:Orbitron;font-weight:900;font-size:clamp(30px,10vw,54px);letter-spacing:.06em;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(54,242,255,.7))}
#toast .s{font-family:Orbitron;font-size:13px;letter-spacing:.3em;color:var(--text);margin-top:6px;text-shadow:0 0 10px var(--pink)}
#flash{position:fixed;inset:0;z-index:12;pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(255,255,255,.9),rgba(54,242,255,.3) 40%,transparent 70%);opacity:0}

/* ---------- MENU ---------- */
#menu{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(28px + var(--st)) 0 calc(22px + var(--sb));background:linear-gradient(180deg,rgba(7,4,24,.75),rgba(7,4,24,.1) 35%,rgba(7,4,24,.2) 55%,rgba(7,4,24,.92));transition:opacity .7s,visibility .7s}
.brand{text-align:center;padding:0 16px}
.logo{font-family:Orbitron;font-weight:900;font-size:clamp(34px,11vw,64px);line-height:.95;letter-spacing:.05em;color:#fff;text-shadow:0 0 18px var(--cyan),0 0 42px rgba(54,242,255,.5);animation:glow 3s ease-in-out infinite}
.logo span{display:block;font-size:.62em;letter-spacing:.32em;background:linear-gradient(90deg,var(--pink),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 14px rgba(255,60,240,.6))}
@keyframes glow{50%{text-shadow:0 0 26px var(--cyan),0 0 60px rgba(54,242,255,.7)}}
.tag{margin-top:10px;font-size:15px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase}
.sel{width:100%}
.sel h3{font-family:Orbitron;font-size:12px;letter-spacing:.35em;color:var(--cyan);text-align:center;margin:0 0 10px;font-weight:500}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 14px;scrollbar-width:none;touch-action:pan-x}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:min(68vw,250px);scroll-snap-align:center;padding:12px;display:flex;gap:12px;text-align:left;transition:transform .35s cubic-bezier(.2,1.4,.4,1),border-color .3s,box-shadow .3s}
.card canvas{width:64px;height:108px;border-radius:10px;background:#05031a;border:1px solid var(--line);flex:0 0 auto}
.card.on{transform:translateY(-6px);border-color:var(--cyan);box-shadow:0 0 30px rgba(54,242,255,.35),inset 0 0 22px rgba(54,242,255,.12)}
.card .n{font-family:Orbitron;font-size:10px;letter-spacing:.25em;color:var(--pink)}
.card .nm{font-family:Orbitron;font-weight:700;font-size:16px;margin:4px 0 4px;line-height:1.1}
.card .d{font-size:13px;color:var(--dim);line-height:1.25;margin-bottom:6px}
.card .chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:Orbitron;font-size:9px;letter-spacing:.12em;padding:3px 6px;border-radius:99px;border:1px solid var(--line);color:var(--text)}
.chip.best{border-color:var(--gold);color:var(--gold)}
.cta{font-family:Orbitron;font-weight:900;font-size:18px;letter-spacing:.25em;padding:16px 46px;border-radius:99px;color:#061018;background:linear-gradient(90deg,var(--cyan),#b8fff9,var(--cyan));background-size:200% 100%;box-shadow:0 0 30px rgba(54,242,255,.6),0 0 0 1px rgba(255,255,255,.4) inset;animation:shine 2.6s linear infinite;transition:transform .15s}
.cta:active{transform:scale(.95)}
@keyframes shine{to{background-position:-200% 0}}
.mfoot{display:flex;flex-direction:column;align-items:center;gap:14px}
.mfoot .row{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim);letter-spacing:.08em;padding:0 16px;text-align:center}

/* ---------- RESULT ---------- */
#result{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(5,3,20,.55);transition:opacity .5s,visibility .5s;padding:16px}
.rcard{width:min(92vw,380px);padding:24px 20px;text-align:center;transform:scale(1);transition:transform .5s cubic-bezier(.2,1.5,.4,1)}
#result.hidden .rcard{transform:scale(.7)}
.rhole{font-family:Orbitron;font-size:11px;letter-spacing:.3em;color:var(--cyan)}
.rterm{font-family:Orbitron;font-weight:900;font-size:clamp(34px,11vw,50px);margin:8px 0 2px;background:linear-gradient(90deg,var(--gold),#fff,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px rgba(255,211,77,.5))}
.rsub{font-size:17px;color:var(--dim);letter-spacing:.08em}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}
.rgrid div{padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.rgrid b{display:block;font-family:Orbitron;font-size:20px}
.rgrid small{font-size:10px;letter-spacing:.2em;color:var(--dim)}
.rbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.rbtns .cta{padding:14px}
.ghost{font-family:Orbitron;font-size:13px;letter-spacing:.2em;padding:12px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.ghost:active{transform:scale(.97)}
#err{position:fixed;inset:0;z-index:99;display:none;place-items:center;text-align:center;padding:24px;font-size:16px;background:var(--bg)}
@media (min-aspect-ratio:1/1){ .ctop{top:calc(18px + var(--st))} #stats{top:calc(100px + var(--st))} }
</style>
</head>
<body>
<div id="app"></div>
<div id="touch"><canvas id="swipe"></canvas></div>
<div id="flash"></div>

<div id="hud" class="hidden">
  <div class="top">
    <div class="holeinfo panel">
      <div class="btns"><button class="icon" id="btnMenu" aria-label="Menu">☰</button><button class="icon" id="btnMute2" aria-label="Sound">♪</button></div>
      <div>
        <div class="hnum" id="hNum">HOLE 1</div>
        <div class="hname" id="hName">—</div>
        <div class="hmeta">PAR <b id="hPar">3</b> · SHOT <b id="hShot">1</b></div>
      </div>
    </div>
    <div class="wind panel"><div class="dial"><div class="arrow" id="windArrow"></div></div><div class="wtxt"><b id="windSpd">0</b><small>MPH</small><i id="windTxt">CALM</i></div></div>
  </div>
  <div class="ctop"><div class="pill panel"><b id="distVal">0</b>yd to pin <span class="lie" id="lie">TEE</span></div></div>
  <div id="meter"><div class="fill" id="meterFill"></div><div class="mark"></div><div class="pct" id="meterPct">0%</div></div>
  <div id="stats" class="panel"></div>
  <div class="hint" id="hint"><span class="chev"><i></i><i></i><i></i></span>SWIPE UP TO SWING<br><small>drag the sky or use ‹ › to aim</small></div>
  <div class="bottom">
    <button class="icon big" id="aimL" aria-label="Aim left">‹</button>
    <button class="club panel" id="btnClub"><small>CLUB · TAP</small><b id="clubName">Driver</b><small id="clubDist">235 yd</small></button>
    <button class="icon big" id="aimR" aria-label="Aim right">›</button>
    <button class="icon" id="btnView" aria-label="Overview">◎</button>
  </div>
</div>

<div id="toast"><div class="t" id="toastT"></div><div class="s" id="toastS"></div></div>

<div id="menu">
  <div class="brand"><div class="logo">NEON<span>FAIRWAY</span></div><div class="tag">dream golf · year 3000</div></div>
  <div class="sel"><h3>SELECT A HOLE</h3><div class="cards" id="cards"></div></div>
  <div class="mfoot">
    <button class="cta" id="btnPlay">TEE OFF</button>
    <div class="row"><button class="icon" id="btnMute" aria-label="Sound">♪</button><span>Swipe up to swing · straight swipes fly straight</span></div>
  </div>
</div>

<div id="result" class="hidden">
  <div class="rcard panel">
    <div class="rhole" id="rHole">HOLE 1</div>
    <div class="rterm" id="rTerm">PAR</div>
    <div class="rsub" id="rSub"></div>
    <div class="rgrid" id="rGrid"></div>
    <div class="rbtns">
      <button class="cta" id="rNext">NEXT HOLE</button>
      <button class="ghost" id="rAgain">REPLAY HOLE</button>
      <button class="ghost" id="rMenu">ALL HOLES</button>
    </div>
  </div>
</div>
<div id="err"></div>

<script type="importmap">

} }

<script>
  window.addEventListener('error', e => {
    if (window.__started) return;
    const el = document.getElementById('err');
    el.style.display = 'grid';
    el.textContent = 'Could not start the game (' + (e.message || 'load error') + '). Check your connection and reload.';
  });
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

window.__started = true;

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const TAU = Math.PI * 2;
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem('nf_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('nf_' + k, JSON.stringify(v)); } catch {} }
};
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

/* =====================================================================
   Course data (hole coordinates: x = right, z = forward from tee, yards)
   ===================================================================== */
const TEEBOX = { rect: [-5, -5, 5, 6] };
const HOLES = [

    tee: [0, 0], pin: [92, 300], bounds: [-55, -12, 145, 335], windMax: 5.5, spires: 70,
    theme: { hor: [0.2, 0.85, 0.95], mid: [0.04, 0.1, 0.3], fog: 0x0f2347 },

    green: { c: [92, 300], r: 15 },

    waypoints: [[0, 200]] },
  { name: 'Nebula Isles', desc: 'Island-hop a par 5 to a green floating in light.', par: 5, seed: 37,
    tee: [0, 0], pin: [25, 476], bounds: [-75, -12, 95, 515], windMax: 7, spires: 64,
    theme: { hor: [0.78, 0.3, 1.0], mid: [0.12, 0.03, 0.32], fog: 0x2a1060 },
    fairway: [{ a: [0, 38], b: [-10, 222], w: 32 }, { a: [-8, 306], b: [16, 418], w: 28 }],
    green: { c: [25, 476], r: 16 },
    sand: [{ c: [14, 468], r: 3.5 }, { c: [-28, 200], r: 7 }, { c: [10, 150], r: 6 }, { c: [-6, 395], r: 6 }],
    water: [{ rect: [-75, 246, 95, 290] }, { c: [25, 476], r0: 19, r1: 37 }],
    waypoints: [[-8, 215], [12, 405]] },
];

const CLUBS = [
  { name: 'Driver', carry: 235, loft: 15 },
  { name: '5 Iron', carry: 180, loft: 21 },
  { name: '9 Iron', carry: 130, loft: 33 },
  { name: 'Wedge', carry: 85, loft: 46 },
  { name: 'Putter', carry: 30, loft: 0, putter: true },

function drawHole(h, ppm) {

      const ang = Math.atan2(by - ay, bx - ax);

      ctx.arc(ax, ay, r, ang + Math.PI / 2, ang + Math.PI * 1.5);

  for (let i = 0; i < W * Ht / 30; i++) { g.fillStyle = `rgba(${120 + R() * 90 | 0},${90 + R() * 90 | 0},255,${R() * .09})`; g.fillRect(R() * W, R() * Ht, 1 + R() * 2, 1 + R() * 2); }

  // plasma water (animated meshes sit on top)
  edge(h.water, '#ff3cf0', '#ff3cf0', 1.6, '#1a0630', '#14001c');
  // fairways
  edge(h.fairway, '#3ffff0', '#2fffe6', 1.4, '#0f6b66', '#02211f');
  g.save(); g.beginPath(); h.fairway.forEach(s => add(g, s)); g.clip();
  const fg = g.createLinearGradient(0, Ht, 0, 0); fg.addColorStop(0, '#0f7d72'); fg.addColorStop(1, '#127e88');
  g.fillStyle = fg; g.fillRect(0, 0, W, Ht);

  for (let i = 0; i < W * Ht / 60; i++) { g.fillStyle = `rgba(160,255,240,${R() * .06})`; g.fillRect(R() * W, R() * Ht, 1.5, 1.5); }
  g.restore();

  edge([TEEBOX], '#a4fffb', '#7ffff5', 1, '#17908a', '#05302d');
  // green
  fillEach(g, [h.green], '#0c5a43', 2.5);
  edge([h.green], '#7dffb0', '#6dffa8', 1.2, '#139a5c', '#031c10');
  const gx = X(h.green.c[0]), gy = Y(h.green.c[1]);

/* =====================================================================

    fragmentShader: `uniform float uTime; varying vec3 vW;

}

/* =====================================================================
   Audio (all synthesized with Web Audio)
   ===================================================================== */
const SFX = (() => {

    const wf = ctx.createBiquadFilter(), wg = ctx.createGain(); wf.type = 'bandpass'; wf.Q.value = .9; wf.frequency.value = 600; wg.gain.value = 0;
    loop().connect(wf); wf.connect(wg); wg.connect(out); whoosh = { f: wf, g: wg };

    loop().connect(windF); windF.connect(windG); windG.connect(out);

    const padF = ctx.createBiquadFilter(), padG = ctx.createGain(); padF.type = 'lowpass'; padF.frequency.value = 520; padG.gain.value = 0;
    padF.connect(padG); padG.connect(out);

    if (!ctx) return; const t = now() + at; const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);

    chargeSet(p) { if (!charge) return; const f = 170 + p * 560; charge.o.frequency.setTargetAtTime(f, now(), .02); charge.o2.frequency.setTargetAtTime(f * 1.5, now(), .02); },
    chargeStop() { if (!charge) return; const c = charge; charge = null; c.g.gain.setTargetAtTime(0, now(), .03); c.o.stop(now() + .25); c.o2.stop(now() + .25); },
    whoosh(speed) { if (!ctx) return; whoosh.g.gain.setTargetAtTime(Math.min(.2, speed * .0028), now(), .08); whoosh.f.frequency.setTargetAtTime(280 + speed * 24, now(), .1); },

let state = 'menu';
const ball = { x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, spin: 0, ground: true, visible: true };
let aimYaw = 0, clubIdx = 0, strokes = 0, lastPos = { x: 0, z: 0 }, overview = false, aimHold = 0;

let shot = null, timeScale = 1, slowTimer = 0, shake = 0, gameTime = 0;
const timers = [];
const later = (sec, fn) => timers.push({ t: sec, fn });
const flightDir = new THREE.Vector3(0, 0, -1);

const fwd = yaw => ({ x: Math.sin(yaw), z: -Math.cos(yaw) });
const yawTo = (x, z) => Math.atan2(x - ball.x, -(z - ball.z));
const distPin = () => Math.hypot(pinW.x - ball.x, pinW.z - ball.z);

function aimTarget() {
  const hz = -ball.z;
  for (const w of hole.waypoints) if (hz < w[1] - 25) return { x: w[0], z: -w[1] };
  return { x: pinW.x, z: pinW.z };
}
function autoClub() {
  const s = surfaceAt(ball.x, ball.z); const t = aimTarget(); const d = Math.hypot(t.x - ball.x, t.z - ball.z);
  if (s === 'green') return 4;
  if (distPin() < 24 && shapeDist(hole.green, ball.x, -ball.z) < 4) return 4;
  let c = d > 195 ? 0 : d > 148 ? 1 : d > 100 ? 2 : 3;
  if ((s === 'rough' || s === 'sand') && c === 0) c = 1;
  return c;
}
function newWind(first) {
  if (first) { wind.baseAng = Math.random() * TAU; wind.baseSpd = hole.windMax * (.25 + Math.random() * .75); }
  const ang = wind.baseAng + (Math.random() - .5) * .7, spd = Math.max(0, wind.baseSpd * (.8 + Math.random() * .4));
  wind.x = Math.sin(ang) * spd; wind.z = -Math.cos(ang) * spd; wind.speed = spd;
  SFX.wind(spd);
}

/* ----- physics step (shared by game + preview) ----- */
function step(b, dt, wx, wz) {
  if (!b.ground) {
    const rx = b.vx - wx, rz = b.vz - wz, ry = b.vy, sp = Math.hypot(rx, ry, rz);
    let ax = -PHYS.k * sp * rx, ay = -PHYS.g - PHYS.k * sp * ry, az = -PHYS.k * sp * rz;
    ax += b.spin * PHYS.curve * (-b.vz); az += b.spin * PHYS.curve * b.vx;
    b.vx += ax * dt; b.vy += ay * dt; b.vz += az * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    b.spin *= Math.exp(-.25 * dt);
    if (b.y <= 0 && b.vy < 0) {
      b.y = 0; const s = surfaceAt(b.x, b.z);
      if (s === 'water' || s === 'oob') return { type: s };

/* =====================================================================

const touchEl = $('touch'), swC = $('swipe'), swX = swC.getContext('2d');

function evalSwipe(pts) {
  if (pts.length < 2) return null;
  const s0 = pts[0]; let k0 = 0;
  while (k0 < pts.length - 1 && Math.hypot(pts[k0].x - s0.x, pts[k0].y - s0.y) < 10) k0++;
  const s = pts[Math.max(0, k0 - 1)], e = pts[pts.length - 1];
  const dx = e.x - s0.x, dy = s0.y - e.y, L = Math.hypot(dx, dy);
  if (dy < 8) return { power: 0, valid: false, dy };
  const ref = clamp(innerHeight * .42, 200, 420);
  const raw = dy / ref;
  const dur = Math.max(.001, (e.t - s.t) / 1000);
  let tempo = dur < .07 ? .82 : dur <= .5 ? 1 : clamp(1 - (dur - .5) / .9, .3, 1);
  let power = raw, over = 0;
  if (raw > 1) { over = Math.min((raw - 1) / .4, 1); power = 1 + over * .08; }
  // straightness: perpendicular bow from start->end chord
  const ux = dx / L, uy = -dy / L; let sum = 0, maxD = 0, n = 0;

  if (over > 0) spin = clamp(spin + over * .35 * (Math.sign(spin) || (Math.random() < .5 ? -1 : 1)), -1, 1);
  if (club.putter) spin *= .1;
  const yawOff = clamp(angle * (club.putter ? .2 : .45), -.32, .32);
  const dirScore = clamp(1 - Math.abs(angle) / .35, 0, 1);
  const accuracy = clamp(100 * (.55 * straight + .45 * dirScore) - over * 22, 0, 100);
  const quality = accuracy * .75 + tempo * 25;
  power *= lerp(.75, 1, tempo);
  const rating = quality >= 92 ? 'PERFECT' : quality >= 80 ? 'GREAT' : quality >= 65 ? 'GOOD' : quality >= 45 ? 'OK' : 'MISHIT';
  const as = Math.abs(spin);
  const shape = as < .12 ? (Math.abs(yawOff) < .03 ? 'Dead Straight' : yawOff > 0 ? 'Push' : 'Pull')

}

const pt = e => ({ x: e.clientX, y: e.clientY, t: performance.now() });

    ${bar('Power', pw, pw > 100 ? 'var(--red)' : 'var(--cyan)')}${bar('Accuracy', ac, col)}${bar('Tempo', tp, 'var(--pink)')}
    <div class="shape"><canvas id="shapeC" width="88" height="116"></canvas><div><b style="color:${col}">${r.shape.toUpperCase()}</b><small>${sub}</small></div></div>
    <div class="dist" id="sDist">In flight…</div>`;
  requestAnimationFrame(() => { $('stats').classList.add('on'); $('stats').querySelectorAll('.bar i').forEach(i => i.style.width = i.dataset.w + '%'); });
  // mini ball-flight sketch
  const c = $('shapeC').getContext('2d'); c.lineCap = 'round';
  c.strokeStyle = 'rgba(255,255,255,.15)'; c.setLineDash([4, 5]); c.lineWidth = 2; c.beginPath(); c.moveTo(44, 108); c.lineTo(44, 8); c.stroke(); c.setLineDash([]);
  c.beginPath(); for (let i = 0; i <= 30; i++) { const t = i / 30; const x = 44 + r.yawOff * 120 * t + r.spin * 34 * t * t; const y = 108 - 100 * t; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  const cc = getComputedStyle(document.documentElement).getPropertyValue(col.slice(4, -1)).trim() || '#36f2ff';
  c.strokeStyle = cc; c.shadowColor = cc; c.shadowBlur = 10; c.lineWidth = 4; c.stroke();
  c.beginPath(); c.arc(44, 108, 5, 0, TAU); c.fillStyle = '#fff'; c.fill();
}
function updateStatsDist() {
  const el = $('sDist'); if (!el || !shot) return;
  el.innerHTML = `Carry <b>${Math.round(shot.carry ?? 0)}</b> yd${shot.total != null ? ` · Total <b>${Math.round(shot.total)}</b> yd` : ''}`;
}
let hudCache = {};
function setText(id, v) { if (hudCache[id] !== v) { hudCache[id] = v; $(id).textContent = v; } }
function updateHud(force) {
  if (force) hudCache = {};
  const club = CLUBS[clubIdx];
  setText('hNum', `HOLE ${holeIdx + 1}`); setText('hName', hole.name); setText('hPar', hole.par);
  setText('hShot', Math.min(strokes + (state === 'flight' || state === 'settle' || state === 'holed' ? 0 : 1), 10));
  setText('distVal', Math.round(distPin()));
  const s = state === 'flight' || state === 'penalty' ? surfaceAt(lastPos.x, lastPos.z) : surfaceAt(ball.x, ball.z); const S = SURF[s];
  if (S) { setText('lie', S.label); $('lie').style.color = S.col; }
  setText('clubName', club.name); setText('clubDist', club.putter ? 'up to 30 yd' : `${club.carry} yd`);
  const mph = Math.round(wind.speed * 2.237); setText('windSpd', mph);
  setText('windTxt', mph < 3 ? 'CALM' : mph < 9 ? 'BREEZE' : mph < 14 ? 'WINDY' : 'GUSTY');
}
function updateWindArrow() {
  const f = new THREE.Vector3(); camera.getWorldDirection(f);
  const camYaw = Math.atan2(f.x, -f.z), wYaw = Math.atan2(wind.x, -wind.z);
  let rel = (wYaw - camYaw) * 180 / Math.PI;
  const el = $('windArrow'); const prev = el._r ?? rel;
  while (rel - prev > 180) rel -= 360; while (rel - prev < -180) rel += 360; // shortest rotation
  if (Math.abs(rel - prev) > .5 || el._r == null) { el._r = rel; el.style.transform = `rotate(${rel}deg)`; }
}

/* ----- HUD buttons ----- */
const hold = (el, v) => {
  el.addEventListener('pointerdown', e => { e.stopPropagation(); SFX.init(); aimHold = v; SFX.blip(v > 0 ? 990 : 880); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, () => aimHold = 0));
};
hold($('aimL'), -1); hold($('aimR'), 1);
$('btnClub').addEventListener('pointerdown', e => { e.stopPropagation(); });
$('btnClub').addEventListener('click', () => { if (state !== 'aim') return; clubIdx = (clubIdx + 1) % CLUBS.length; SFX.blip(660); updateHud(); const b = $('btnClub'); b.animate([{ transform: 'scale(.9)' }, { transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 300 }); });
function setOverview(v) { overview = v; $('btnView').style.color = v ? 'var(--cyan)' : ''; }
$('btnView').addEventListener('pointerdown', e => e.stopPropagation());
$('btnView').addEventListener('click', () => { if (state === 'aim') { setOverview(!overview); SFX.blip(1200); } });
$('btnMenu').addEventListener('click', () => { SFX.blip(500); goMenu(); });
const muteBtns = [$('btnMute'), $('btnMute2')];
const refreshMute = () => muteBtns.forEach(b => { b.textContent = SFX.muted ? '✕' : '♪'; b.style.color = SFX.muted ? 'var(--red)' : ''; });
muteBtns.forEach(b => b.addEventListener('click', () => { SFX.init(); SFX.toggleMute(); refreshMute(); SFX.blip(); }));
refreshMute();
$('rAgain').addEventListener('click', () => { SFX.init(); SFX.blip(); startHole(holeIdx); });
$('rNext').addEventListener('click', () => { SFX.init(); SFX.blip(); const n = (holeIdx + 1) % HOLES.length; buildHole(n); startHole(n); });
$('rMenu').addEventListener('click', () => { SFX.init(); SFX.blip(); goMenu(); });
$('btnPlay').addEventListener('click', () => { SFX.init(); SFX.blip(1100); startHole(menuSel); });
['hud', 'result', 'menu'].forEach(id => $(id).addEventListener('pointerdown', e => { if (e.target.closest('button,.card')) e.stopPropagation(); }));

/* ----- menu cards ----- */
let menuSel = 0;
const thumbs = HOLES.map(h => drawHole(h, 1.2).color);
function renderCards() {
  const best = store.get('best', {});
  const wrap = $('cards'); wrap.innerHTML = '';
  HOLES.forEach((h, i) => {
    const el = document.createElement('button'); el.className = 'card panel' + (i === menuSel ? ' on' : '');
    const wl = h.windMax < 4 ? 'LIGHT WIND' : h.windMax < 6 ? 'MED WIND' : 'STRONG WIND';
    el.innerHTML = `<canvas width="128" height="216"></canvas><div><div class="n">HOLE ${i + 1}</div><div class="nm">${h.name}</div><div class="d">${h.desc}</div>
      <div class="chips"><span class="chip">PAR ${h.par}</span><span class="chip">${holeLen(h)} YD</span><span class="chip">${wl}</span>${best[i] != null ? `<span class="chip best">BEST ${best[i]}</span>` : ''}</div></div>`;
    const c = el.querySelector('canvas').getContext('2d'); const t = thumbs[i];
    c.fillStyle = '#05031a'; c.fillRect(0, 0, 128, 216);
    const sc = Math.min(120 / t.width, 208 / t.height); c.drawImage(t, (128 - t.width * sc) / 2, (216 - t.height * sc) / 2, t.width * sc, t.height * sc);
    el.addEventListener('click', () => { SFX.init(); if (menuSel === i) { SFX.blip(1100); startHole(i); return; } menuSel = i; SFX.blip(760 + i * 120); buildHole(i); renderCards(); snapCam(); });
    wrap.appendChild(el);
  });
}

/* =====================================================================
   Camera
   ===================================================================== */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
const _dp = new THREE.Vector3(), _dl = new THREE.Vector3();
function menuPose(t) {
  const [x0, z0, x1, z1] = hole.bounds; const L = Math.max(x1 - x0, z1 - z0);
  const a = t * .05 + 2.2, R = L * .62 + 60;
  _dp.set(holeCenter.x + Math.cos(a) * R, 70 + L * .12, holeCenter.z + Math.sin(a) * R); _dl.copy(holeCenter);
}
function snapCam() { menuPose(gameTime); camPos.copy(_dp); camLook.copy(_dl); }
function updateCamera(dt) {
  let rp = 3, rl = 4;
  const club = CLUBS[clubIdx];
  if (state === 'menu' || state === 'result') { menuPose(gameTime); rp = 1.2; rl = 1.5; }
  else if (overview) {
    const mx = (ball.x + pinW.x) / 2, mz = (ball.z + pinW.z) / 2, d = distPin(); const f = fwd(aimYaw);
    _dp.set(mx - f.x * d * .35, d * .85 + 30, mz - f.z * d * .35); _dl.set(mx, 0, mz); rp = 2.5; rl = 3;
  } else if (state === 'flight' || state === 'holed' || state === 'penalty' || state === 'settle') {
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 2 && state === 'flight') { flightDir.x = damp(flightDir.x, ball.vx / sp, 1.6, dt); flightDir.z = damp(flightDir.z, ball.vz / sp, 1.6, dt); flightDir.normalize(); }
    const putt = shot && shot.club.putter;
    const back = putt ? 6 : 14, up = putt ? 2.8 : 5.5 + ball.y * .4;
    _dp.set(ball.x - flightDir.x * back, up, ball.z - flightDir.z * back); _dl.set(ball.x, putt ? ball.y + .3 : ball.y + 3.2, ball.z);
    const t = shot ? shot.t : 1;
    rp = putt ? 3 : t < .35 ? .5 : t < 1.2 ? 2.2 : 3; rl = putt ? 8 : t < .25 ? 8 : 30;
    if (state === 'holed') { _dp.set(pinW.x - flightDir.x * 15, 7, pinW.z - flightDir.z * 15); _dl.copy(pinW).setY(1.5); rp = 1.5; rl = 3; }
  } else { // aim / swing / intro
    const f = fwd(aimYaw), putt = club.putter;
    const back = putt ? 5.2 : 8.5, up = putt ? 2.3 : 3, ahead = putt ? 7 : 30;
    _dp.set(ball.x - f.x * back, up, ball.z - f.z * back); _dl.set(ball.x + f.x * ahead, putt ? 0 : 1.5, ball.z + f.z * ahead);
    rp = state === 'intro' ? 1.4 : 5; rl = state === 'intro' ? 1.6 : 6;
  }
  camPos.x = damp(camPos.x, _dp.x, rp, dt); camPos.y = damp(camPos.y, _dp.y, rp, dt); camPos.z = damp(camPos.z, _dp.z, rp, dt);
  camLook.x = damp(camLook.x, _dl.x, rl, dt); camLook.y = damp(camLook.y, _dl.y, rl, dt); camLook.z = damp(camLook.z, _dl.z, rl, dt);
  camera.position.copy(camPos);
  if (shake > .001) { camera.position.x += (Math.random() - .5) * shake; camera.position.y += (Math.random() - .5) * shake; camera.position.z += (Math.random() - .5) * shake; shake *= Math.exp(-dt * 7); }
  camera.position.y = Math.max(camera.position.y, .6);
  camera.lookAt(camLook);
}

/* =====================================================================
   Main loop
   ===================================================================== */
const _c = new THREE.Color();
let last = performance.now(), slowFrames = 0, hudT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; gameTime += dt;
  // adaptive quality for weaker phones
  if (dt > .042) { if (++slowFrames > 90 && PR > 1) { PR = Math.max(1, PR - .35); applySize(); slowFrames = 0; } } else slowFrames = Math.max(0, slowFrames - 1);

  if (slowTimer > 0) slowTimer -= dt; else timeScale = damp(timeScale, 1, 5, dt);
  const gdt = dt * timeScale;
  for (let i = timers.length - 1; i >= 0; i--) { timers[i].t -= dt; if (timers[i].t <= 0) { const f = timers[i].fn; timers.splice(i, 1); f(); } }
  if (toastTimer > 0) { toastTimer -= dt; if (toastTimer <= 0) $('toast').classList.remove('on'); }

  if (state === 'aim' && aimHold) aimYaw += aimHold * dt * (CLUBS[clubIdx].putter ? .3 : .55);

  if (state === 'flight') {
    shot.t += gdt;
    physics(gdt);
    if (shot.t > 30 && state === 'flight') ballStopped();
    // trail
    const sp = Math.hypot(ball.vx, ball.vy, ball.vz);
    if (!shot.club.putter || sp > 1) {
      const lt = shot.lastTrail; let dd = Math.hypot(ball.x - lt.x, ball.y - lt.y, ball.z - lt.z); const stepL = shot.club.putter ? .25 : .4;
      while (dd > stepL) {
        const k = stepL / dd; lt.x += (ball.x - lt.x) * k; lt.y += (ball.y - lt.y) * k; lt.z += (ball.z - lt.z) * k; dd -= stepL;
        const c = shot.perfect ? _c.copy(COL.gold).lerp(COL.white, Math.random() * .3) : _c.copy(COL.cyan).lerp(COL.pink, clamp(shot.t / 4, 0, 1));
        FX.spawn(lt.x, lt.y + BALL_R, lt.z, 0, 0, 0, c, shot.club.putter ? .3 : .7, shot.club.putter ? .6 : 1.4);
      }
    }
    SFX.whoosh(ball.ground ? 0 : sp);
  } else SFX.whoosh(0);

  if (holedAnim) { holedAnim.t += gdt; const t = Math.min(1, holedAnim.t / .35);
    ball.x = lerp(holedAnim.sx, pinW.x, t); ball.z = lerp(holedAnim.sz, pinW.z, t); ball.y = -t * .5; if (t >= 1) ball.visible = false; }
  if (beamMat) beamMat.uniforms.uBoost.value = damp(beamMat.uniforms.uBoost.value, 0, .6, dt);

  // ball visuals
  ballMesh.visible = ball.visible && state !== 'menu' && state !== 'result';
  ballMesh.position.set(ball.x, ball.y + BALL_R, ball.z);
  const spd = Math.hypot(ball.vx, ball.vz); ballMesh.rotation.x -= spd * gdt * 2.5; ballMesh.rotation.y += ball.spin * gdt * 8;
  ballGlow.material.color.copy(shot && shot.perfect && state === 'flight' ? COL.gold : COL.cyan);
  ballGlow.scale.setScalar(clamp(camera.position.distanceTo(ballMesh.position) * .07, 1.6, 9));
  shadow.visible = ballMesh.visible; shadow.position.set(ball.x, .03, ball.z); const sh = 1 / (1 + ball.y * .15); shadow.scale.setScalar(sh); shadow.material.opacity = .5 * sh;
  const aiming = state === 'aim' || state === 'swing';
  pad.visible = aiming || state === 'intro'; pad.position.set(ball.x, .04, ball.z);
  padRing.scale.setScalar(1 + Math.sin(gameTime * 4) * .08); padRing2.rotation.z = gameTime * .8; padRing.material.opacity = .6 + Math.sin(gameTime * 4) * .3;

  // trajectory preview
  preview.visible = reticle.visible = aiming && !overview;
  if (preview.visible) {
    if (state === 'swing' && sw.live && sw.live.power > 0) updatePreview(clamp(sw.live.power, 0, 1.1), sw.live.yawOff, sw.live.spin);
    else updatePreview(1, 0, 0);
    const rd = camera.position.distanceTo(reticle.position); reticle.scale.setScalar(Math.max(.6, rd / 45) * (1 + Math.sin(gameTime * 5) * .06));
    retB.material.opacity = .9; prevMat.opacity = state === 'swing' ? 1 : .55;
  }
  // power meter
  const m = $('meter');
  if (state === 'swing' && sw.live) { m.classList.add('on'); const p = clamp(sw.live.raw || 0, 0, 1.4); $('meterFill').style.height = `${Math.min(p / 1.08, 1) * 100}%`; $('meterPct').textContent = Math.round(clamp(sw.live.power, 0, 1.1) * 100) + '%'; }
  else m.classList.remove('on');

  // world animation
  waterU.uTime.value = gameTime; skyU.uTime.value = gameTime;
  if (flag) { const a = flag.geometry.attributes.position, b = flag.userData.base;
    for (let i = 0; i < a.count; i++) { const x = b[i * 3]; a.array[i * 3 + 2] = Math.sin(x * 3.2 - gameTime * 6) * .16 * x + Math.sin(gameTime * 2.3) * .05 * x; }
    a.needsUpdate = true; flag.rotation.y = Math.atan2(-wind.z, wind.x) * (wind.speed > .3 ? 1 : 0); }
  if (cupRim) cupRim.material.opacity = .6 + Math.sin(gameTime * 3) * .3;
  planet.rotation.y += dt * .01;

  // wind streaks around camera
  { const arr = stGeo.attributes.position.array, wl = wind.speed, ux = wind.x / (wl || 1), uz = wind.z / (wl || 1), cp = camera.position;
    for (let i = 0; i < STREAKS; i++) { const s = stBase[i];
      s.x += wind.x * gdt * 2.2; s.z += wind.z * gdt * 2.2;
      if (s.x - cp.x > 80) s.x -= 160; if (s.x - cp.x < -80) s.x += 160; if (s.z - cp.z > 80) s.z -= 160; if (s.z - cp.z < -80) s.z += 160;
      const len = s.l * (1 + wl * .7);
      arr[i * 6] = s.x; arr[i * 6 + 1] = s.y; arr[i * 6 + 2] = s.z; arr[i * 6 + 3] = s.x - ux * len; arr[i * 6 + 4] = s.y; arr[i * 6 + 5] = s.z - uz * len; }
    stGeo.attributes.position.needsUpdate = true; stMat.opacity = clamp(wl / 9, .04, .45); }
  { const arr = moteGeo.attributes.position.array;
    for (let i = 0; i < moteBase.length; i++) { const m2 = moteBase[i]; m2.y += gdt * m2.s * .6; if (m2.y > 32) m2.y = 1; m2.x += wind.x * gdt * .3; m2.z += wind.z * gdt * .3;
      arr[i * 3] = m2.x + Math.sin(gameTime * .5 + m2.p) * 1.5; arr[i * 3 + 1] = m2.y; arr[i * 3 + 2] = m2.z + Math.cos(gameTime * .4 + m2.p) * 1.5; }
    moteGeo.attributes.position.needsUpdate = true; }

  FX.update(gdt); updateRings(gdt);
  updateCamera(dt);
  drawSwipe(dt);
  if ((hudT -= dt) <= 0 && state !== 'menu') { hudT = .1; updateHud(); updateWindArrow(); }
  composer.render();
}

function applySize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(PR); renderer.setSize(w, h);
  composer.setPixelRatio(PR); composer.setSize(w, h);
  camera.aspect = w / h; camera.fov = w / h > 1 ? 50 : 58; camera.updateProjectionMatrix();
  FX.u.uScale.value = h * PR / (2 * Math.tan(camera.fov * Math.PI / 360));
  SDPR = Math.min(devicePixelRatio || 1, 2); swC.width = w * SDPR; swC.height = h * SDPR;
}
window.addEventListener('resize', applySize);
applySize();
buildHole(0); renderCards(); snapCam(); newWind(true);
requestAnimationFrame(frame);
</script>
